name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
      - name: Preparer Pages
        uses: actions/configure-pages@v5
      - name: Empaqueter le dossier dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deployer
        id: deploiement
        uses: actions/deploy-pages@v4
